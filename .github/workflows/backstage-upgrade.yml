name: 'Backstage Upgrade'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Backstage version to upgrade to'
        required: true
        default: 'next'
        type: string

jobs:
  # Job 1: Backstage upgrade
  upgrade:
    name: Upgrade Backstage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upgrade-status: ${{ steps.upgrade-result.outputs.status }}
      packages-updated: ${{ steps.upgrade-result.outputs.packages }}

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      # Install dependencies
      - name: Install dependencies
        run: yarn install

      # Fix install issue from next step
      - name: Backup .yarnrc
        run: cp .yarnrc.yml .yarnrc.yml__

      - name: Allow lockfile override
        run: |
          echo "enableImmutableInstalls: false" >> .yarnrc.yml

      - name: DEBUGGING OUTPUT
        run: cat .yarnrc.yml

      # Run Backstage version bump
      - name: Upgrade Backstage to ${{ inputs.version }}
        run: yarn backstage-cli versions:bump --release ${{ inputs.version }}

      - name: Restore .yarnrc.yml
        if: always()
        run: mv -f .yarnrc.yml__ .yarnrc.yml

      - name: Set upgrade results
        id: upgrade-result
        run: |
          echo "status=success" >> $GITHUB_OUTPUT
          echo "packages=$(git diff --name-only | grep package.json | wc -l)" >> $GITHUB_OUTPUT

      - name: Generate upgrade summary
        run: |
          echo "## 🚀 Backstage Upgrade Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Version Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Version**: \`${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Upgrade Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Packages Updated**: ${{ steps.upgrade-result.outputs.packages }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Modified Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git diff --name-only >> $GITHUB_STEP_SUMMARY || echo "No changes detected" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Changelog will be fetched in parallel job" >> $GITHUB_STEP_SUMMARY
          echo "- Pull request will be created automatically" >> $GITHUB_STEP_SUMMARY

      # Upload changes as artifact for the PR job
      - name: Upload upgrade changes
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-changes
          path: |
            backstage.json
            package.json
            packages/*/package.json
            yarn.lock

  # Job 2: Fetch changelog (runs in parallel)
  fetch-changelog:
    name: Fetch Changelog
    runs-on: ubuntu-latest
    outputs:
      breaking-changes: ${{ steps.changelog.outputs.breaking_changes }}
      changelog-available: ${{ steps.changelog.outputs.changelog_available }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fetch changelog content from Backstage docs
      - name: Fetch changelog content
        id: changelog
        run: |
          VERSION="${{ inputs.version }}"
          CHANGELOG_URL="https://backstage.io/docs/releases/v${VERSION}"

          # Fetch the changelog page
          RESPONSE=$(curl -s -w "HTTPSTATUS:%{http_code}" "$CHANGELOG_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')
          CONTENT=$(echo "$RESPONSE" | sed -e 's/HTTPSTATUS:.*//g')

          if [ "$HTTP_CODE" -eq 200 ]; then
            # Extract breaking changes (headings starting with "BREAKING:")
            BREAKING_CHANGES=$(echo "$CONTENT" | grep -i '<h[1-6][^>]*>.*BREAKING:' | sed 's/<[^>]*>//g' || echo "")
            
            if [ -z "$BREAKING_CHANGES" ]; then
              BREAKING_CHANGES="No breaking changes reported"
            fi
            
            # Save breaking changes to output
            echo "breaking_changes<<EOF" >> $GITHUB_OUTPUT
            echo "$BREAKING_CHANGES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            
            echo "changelog_available=true" >> $GITHUB_OUTPUT
          else
            echo "breaking_changes=No breaking changes reported" >> $GITHUB_OUTPUT
            echo "changelog_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog summary
        run: |
          echo "## 📖 Changelog Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changelog Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Changelog Available**: ${{ steps.changelog.outputs.changelog_available == 'true' && '✅ Yes' || '❌ No' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Documentation URL**: [Backstage v${{ inputs.version }} Release](https://backstage.io/docs/releases/v${{ inputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Breaking Changes" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.changelog.outputs.breaking_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Final job: Create PR (depends on all previous jobs)
  create-pull-request:
    name: Create Pull Request
    runs-on: ubuntu-latest
    # This job waits for ALL the jobs listed in 'needs' to complete
    needs: [upgrade, fetch-changelog]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Download upgrade artifacts
      - name: Download upgrade changes
        uses: actions/download-artifact@v4
        with:
          name: upgrade-changes

      # Create Pull Request
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: upgrade Backstage to v${{ inputs.version }}'
          title: 'chore: upgrade Backstage to v${{ inputs.version }}'
          branch: 'backstage/upgrade-to-${{ inputs.version }}'
          draft: true
          delete-branch: true
          body: |
            ## Backstage Upgrade to ${{ inputs.version }}

            This PR upgrades Backstage to version `${{ inputs.version }}` using the Backstage CLI.

            ### 📊 Upgrade Summary
            - **Status**: ${{ needs.upgrade.outputs.upgrade-status }}
            - **Packages Updated**: ${{ needs.upgrade.outputs.packages-updated }}
            - **Changelog Available**: ${{ needs.fetch-changelog.outputs.changelog-available }}

            ### 📖 Documentation & Changelog
            - [Release documentation](https://backstage.io/docs/releases/${{ inputs.version }})

            ### ⚠️ Breaking Changes
            ${{ needs.fetch-changelog.outputs.breaking-changes }}

            ### 🔄 Changes Made
            - Updated Backstage packages to version `${{ inputs.version }}`
            - Dependencies have been automatically updated by the Backstage CLI

            ### ✅ Next Steps
            - [ ] Review the changes in this PR
            - [ ] Test the application locally
            - [ ] Check for any additional manual updates needed
            - [ ] Verify that all plugins are compatible with the new version

            ---
            *This PR was created automatically by the Backstage Upgrade workflow.*
          labels: |
            dependencies
            backstage-upgrade
            automated-pr

      - name: Generate PR creation summary
        run: |
          echo "## 📝 Pull Request Creation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PR Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Title**: chore: upgrade Backstage to v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: backstage/upgrade-to-${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Labels**: dependencies, backstage-upgrade, automated-pr" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Included Data" >> $GITHUB_STEP_SUMMARY
          echo "- **Upgrade Status**: ${{ needs.upgrade.outputs.upgrade-status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Packages Updated**: ${{ needs.upgrade.outputs.packages-updated }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changelog Available**: ${{ needs.fetch-changelog.outputs.changelog-available }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎉 Workflow Complete!" >> $GITHUB_STEP_SUMMARY
          echo "Your Backstage upgrade PR has been created and is ready for review." >> $GITHUB_STEP_SUMMARY
